<!doctype html>
<html><head><meta charset="utf-8"><title>The category standard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;position:relative;font-family:Nunito,sans-serif;color:#1f2937;background:linear-gradient(#87ceeb 0 38%,#1ea7d8 38% 100%)}
.boat{position:absolute;left:660px;top:455px;width:110px;height:34px;background:#fff;border-radius:6px 6px 40px 40px;border:3px solid #2563eb}
.stack{position:absolute;left:20px;top:20px;width:250px;display:grid;gap:10px}
.card{background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.card small{font:600 12px Nunito;color:#4b5563;text-transform:uppercase;letter-spacing:.06em;display:block}
.card b{font:800 26px Nunito}
.track{height:8px;background:#e5e7eb;border-radius:4px;margin-top:6px}
.track i{display:block;height:100%;width:42%;background:#2563eb;border-radius:4px}
.acts{position:absolute;left:50%;top:20px;transform:translateX(-50%);display:flex;gap:12px}
.btn{font:800 17px Nunito;padding:13px 24px;border-radius:12px;background:#2563eb;color:#fff;box-shadow:0 4px 0 #1d4ed8}
.btn.sell{background:#f59e0b;color:#1f2937;box-shadow:0 4px 0 #b45309}
.btn kbd{font:700 12px Nunito;border:2px solid currentColor;padding:0 6px;border-radius:4px;margin-left:8px}
.panel{position:absolute;right:20px;top:20px;width:320px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.panel h3{font:800 18px Nunito;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:#f3f4f6;margin-bottom:8px}
.row b{font:800 15px Nunito}.row span{display:block;font:600 12px Nunito;color:#4b5563}
.row i{font:800 15px Nunito;font-style:normal;background:#2563eb;color:#fff;padding:4px 10px;border-radius:8px}
.row.no i{background:#d1d5db;color:#374151}
.hint{position:absolute;left:20px;bottom:20px;background:rgba(31,41,55,.85);color:#fff;font:600 13px Nunito;padding:8px 12px;border-radius:8px}
</style></head><body>
<div class="boat"></div>
<div class="stack">
<div class="card"><small>Contract 1</small><b>212 / 500</b><div class="track"><i></i></div></div>
<div class="card"><small>Money</small><b>$340</b></div>
<div class="card"><small>Hold</small><b>74 / 100</b></div>
<div class="card"><small>Fishing zone</small><b>In zone</b></div>
</div>
<div class="acts"><div class="btn">Reel in<kbd>F</kbd></div><div class="btn sell">Sell 74 · $148<kbd>E</kbd></div></div>
<div class="panel"><h3>Upgrades</h3>
<div class="row"><div><b>Bigger Hold</b><span>+100 fish · Lvl 1</span></div><i>$100</i></div>
<div class="row"><div><b>Faster Line</b><span>Lvl 2</span></div><i>$200</i></div>
<div class="row"><div><b>Boat Engine</b><span>Lvl 1</span></div><i>$300</i></div>
<div class="row no"><div><b>Fish Research</b><span>Lvl 1</span></div><i>$500</i></div>
</div>
<div class="hint">Move WASD · Fish F · Sell E · Contract Q</div>
</body></html>
